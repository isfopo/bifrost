# Bifrost — self-hosted webhook bridge with declarative mappings.
#
# Secrets are injected from .env (compose auto-loads it) or the shell.
# Copy .env.example to .env and fill it in.
services:
  bifrost:
    build: .
    image: bifrost:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      # List every *_env secret your config.yaml references:
      PLANE_WEBHOOK_SECRET: ${PLANE_WEBHOOK_SECRET}
      CALDAV_USER: ${CALDAV_USER}
      CALDAV_PASS: ${CALDAV_PASS}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
