# Bifrost from the published image: ghcr.io/isfopo/bifrost.
#
# Start:  cp .env.example .env  (fill in the values your config.yaml references)
#         docker compose up -d
#
# Building your own image instead (forks, tweaks)?  The Dockerfile is the
# single source of truth — CI uses it too:
#   docker build -t bifrost . && docker compose up -d
# ...after replacing `image:` below, or run compose with:
#   docker compose up -d --build
#
# Services and flows live in ./config.yaml; secrets never do — the *_env
# keys in config.yaml are read from the environment (compose auto-loads .env).

services:
  bifrost:
    image: ghcr.io/isfopo/bifrost:latest
    # Prefer pinning for unattended hosts: image: ghcr.io/isfopo/bifrost:0.2.0
    restart: unless-stopped
    ports:
      - "29618:29618"
    environment:
      # Every *_env key referenced in your config.yaml needs an entry here.
      # Only list the ones your config actually uses; remove the rest.
      # Keep the BIFROST_ prefix so your .env can't clash with other tools.
      BIFROST_ADDR: ":29618"
      BIFROST_PLANE_WEBHOOK_SECRET: ${BIFROST_PLANE_WEBHOOK_SECRET}
      BIFROST_CALDAV_USER: ${BIFROST_CALDAV_USER}
      BIFROST_CALDAV_PASS: ${BIFROST_CALDAV_PASS}
      BIFROST_SMTP_USER: ${BIFROST_SMTP_USER}
      BIFROST_SMTP_PASS: ${BIFROST_SMTP_PASS}
      BIFROST_MQTT_USER: ${BIFROST_MQTT_USER}
      BIFROST_MQTT_PASS: ${BIFROST_MQTT_PASS}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
